[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-label-anchor"
version = "1.0.1"
description = "SOLAR: label-anchor contrastive learning for annotation-preserving single-cell integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "h5py>=3.10",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.2",
]

[project.optional-dependencies]
# Only needed to regenerate the results tables / figures in scripts/.
# Not required to install and use SOLAR itself.
scripts = ["pandas>=2", "matplotlib>=3.7", "pytest>=8"]

[project.scripts]
solar-benchmark = "SOLAR.benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
